
name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Electron binary
        run: npx install-electron

      - name: Build Windows installer
        run: pnpm --filter @nova/desktop run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/desktop/dist-installer" -Filter "*.exe"
          if (-not $files) {
            throw "Installer EXE was not created."
          }
          $files | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Player-Setup
          path: apps/desktop/dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist-installer/*.exe

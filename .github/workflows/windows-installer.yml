name: Windows installer

# Builds ONE Windows installer (a single NSIS .exe) on a real Windows runner and attaches it as a downloadable
# artifact. Run it from the Actions tab ("Run workflow"), or push a tag like v0.16.0 to also attach the installer to a
# GitHub Release. The installer is UNSIGNED unless you add a code-signing certificate yourself (see RELEASING.md):
# Windows SmartScreen will show "Windows protected your PC" - choose "More info" > "Run anyway".

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # only used to attach the installer to a Release when a tag is pushed

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the Electron binary (pnpm skips install scripts)
        run: npx install-electron

      # Typecheck, lint and tests run on Linux in ci.yml (that is where they were validated); this workflow only builds.

      - name: Build the installer
        run: pnpm --filter @nova/desktop run dist:win

      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem apps/desktop/dist-installer | Where-Object { $_.Extension -in '.exe','.yml','.blockmap' } | Select-Object Name, Length

      - name: Upload the single installer
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Player-Setup
          path: apps/desktop/dist-installer/Nova-Player-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml + .blockmap are what the installed app reads to find and download the update.
          files: |
            apps/desktop/dist-installer/Nova-Player-Setup-*.exe
            apps/desktop/dist-installer/Nova-Player-Setup-*.exe.blockmap
            apps/desktop/dist-installer/latest.yml

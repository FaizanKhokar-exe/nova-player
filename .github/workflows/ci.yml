name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Some tests load the real Electron binary. GitHub's download server sometimes answers 504 for a moment,
      # so fetch it up front: cached, and retried up to 5 times.
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-dl-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-dl-${{ runner.os }}-

      - name: Fetch the Electron binary (with retries)
        run: |
          for i in 1 2 3 4 5; do
            npx install-electron && exit 0
            echo "Download failed (attempt $i of 5), waiting before retrying..."
            sleep $((20 * i))
          done
          exit 1

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit + component tests
        run: pnpm exec vitest run

  # Electron/Playwright E2E runs separately from the fast unit/component
  # job above so a slow or environment-flaky E2E run never blocks the
  # fast feedback loop. Scheduled/on-demand per the accepted testing
  # strategy, not on every push, since it needs a full Electron build.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Some tests load the real Electron binary. GitHub's download server sometimes answers 504 for a moment,
      # so fetch it up front: cached, and retried up to 5 times.
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-dl-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-dl-${{ runner.os }}-

      - name: Fetch the Electron binary (with retries)
        run: |
          for i in 1 2 3 4 5; do
            npx install-electron && exit 0
            echo "Download failed (attempt $i of 5), waiting before retrying..."
            sleep $((20 * i))
          done
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @nova/desktop run build
      - run: xvfb-run -a pnpm exec playwright test

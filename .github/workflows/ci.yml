name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit + component tests
        run: pnpm exec vitest run

  # Electron/Playwright E2E runs separately from the fast unit/component
  # job above so a slow or environment-flaky E2E run never blocks the
  # fast feedback loop. Scheduled/on-demand per the accepted testing
  # strategy, not on every push, since it needs a full Electron build.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @nova/desktop run build
      - run: xvfb-run -a pnpm exec playwright test
